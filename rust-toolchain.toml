# Pinned stable toolchain. Bevy v0.20.0 (b3bdd75b) declares rust-version
# 1.97.1; 1.99.1 is the latest stable release at the time of this rewrite
# (verified via the rust-lang/rust GitHub releases API on 2026-10-16).
# The previous configuration required nightly (`-Z` rustflags, `build-std`,
# `panic-immediate-abort`); none of that is needed by Bevy v0.20.0 or by this
# application, so the project now builds on stable.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
