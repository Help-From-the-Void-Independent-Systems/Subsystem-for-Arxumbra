[build]
rustflags = ["-C", "target-cpu=native", "-Z", "location-detail=none", "-Z", "trap-unreachable=yes"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "target-cpu=native", "-Z", "location-detail=none", "-Z", "trap-unreachable=yes", "-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "target-cpu=native", "-Z", "location-detail=none", "-Z", "trap-unreachable=yes", "-C", "link-arg=-fuse-ld=lld"]

[unstable]
build-std = ["std", "panic_abort"]
