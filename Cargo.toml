[package]
name = "Subsystem-for-Arxumbra"
version = "0.0.0-s1"
edition = "2024"

[dependencies]
mimalloc = { git = "https://github.com/purpleprotocol/mimalloc_rust", tag = "v0.1.52", default-features = false, features = [] }
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.20.0", default-features = false, features = [
    "std",
    "async_executor",
    "multi_threaded",
    "bevy_asset",
    "bevy_window",
    "bevy_winit",
    "wayland",
    "bevy_render",
    "bevy_image",
    "png",
    "bevy_camera",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
] }
