[package]
name = "subsystem-for-arxumbra"
version = "0.0.0-s1"
edition = "2024"
rust-version = "1.97.1"

[dependencies]
bevy = { git = "https://github.com/bevyengine/bevy", tag = "v0.20.0", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_log",
    "bevy_asset",
    "bevy_winit",
    "wayland",
    "x11",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_camera",
    "bevy_image",
    "png",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
] }

[lints.clippy]
redundant_closure_call = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
incremental = false
