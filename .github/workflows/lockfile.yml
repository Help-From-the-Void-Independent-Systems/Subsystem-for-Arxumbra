name: Lockfile bootstrap

on:
  push:
    branches:
      - arena/699178e0-subsystem-for-arxumbra

permissions:
  contents: read

jobs:
  lockfile:
    name: Commit the Cargo-resolved lockfile once
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux system libraries (winit wayland and x11 backends)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Activate the pinned toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Generate the lockfile through Cargo when it is absent
        if: hashFiles('Cargo.lock') == ''
        run: |
          set -euo pipefail
          cargo generate-lockfile

      - name: Commit and push the Cargo-resolved lockfile
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain Cargo.lock)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "Add the Cargo-resolved lockfile [skip ci]"
            git push
          else
            echo "Cargo.lock already tracked; nothing to commit"
          fi
