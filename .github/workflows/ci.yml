name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  policy:
    name: Source, manifest, workflow, and matrix policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run the syntax-aware policy scan with fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import re
          import sys
          import tomllib

          KEYWORDS = [
              ("use", 0), ("let", 0), ("mut", 1), ("const", 0), ("static", 2),
              ("unsafe", 0), ("extern", 0), ("dyn", 0), ("macro_rules", 0),
              ("RefCell", 0), ("Cell", 0), ("Mutex", 0), ("RwLock", 0),
              ("AtomicBool", 0), ("AtomicUsize", 0), ("include_bytes", 0),
              ("include_str", 0), ("no_implicit_prelude", 0), ("transmute", 0),
              ("from_raw_parts", 0), ("as_mut_ptr", 0),
          ]

          def is_word(c):
              return c.isalnum() or c == "_"

          def rust_tokens(src):
              i = 0
              n = len(src)
              out = []
              while i < n:
                  c = src[i]
                  if c == "/" and i + 1 < n and src[i + 1] == "/":
                      j = src.find("\n", i)
                      j = n if j < 0 else j
                      out.append(("comment", src[i:j]))
                      i = j
                  elif c == "/" and i + 1 < n and src[i + 1] == "*":
                      j = src.find("*/", i + 2)
                      j = n if j < 0 else j + 2
                      out.append(("comment", src[i:j]))
                      i = j
                  elif c == '"':
                      j = i + 1
                      closed = False
                      while j < n:
                          if src[j] == "\\":
                              j += 2
                              continue
                          if src[j] == '"':
                              j += 1
                              closed = True
                              break
                          j += 1
                      if not closed:
                          raise AssertionError("unterminated string literal")
                      out.append(("literal", src[i:j]))
                      i = j
                  elif c == "'":
                      j = i + 1
                      if j < n and src[j] == "\\":
                          j += 2
                      else:
                          j += 1
                      if j < n and src[j] == "'":
                          j += 1
                          out.append(("literal", src[i:j]))
                          i = j
                      else:
                          j = i + 1
                          while j < n and (src[j].isalnum() or src[j] == "_"):
                              j += 1
                          if j < n and src[j] == "'":
                              j += 1
                              out.append(("lifetime", src[i:j]))
                              i = j
                          else:
                              out.append(("code", src[i]))
                              i += 1
                  else:
                      j = i + 1
                      while j < n and src[j] not in "/\"'":
                          j += 1
                      out.append(("code", src[i:j]))
                      i = j
              return out

          def rust_keyword_violations(masked):
              found = []
              for kw, exc in KEYWORDS:
                  for m in re.finditer(re.escape(kw), masked):
                      s, e = m.start(), m.end()
                      if s > 0 and is_word(masked[s - 1]):
                          continue
                      if e < len(masked) and is_word(masked[e]):
                          continue
                      p = next((ch for ch in reversed(masked[:s]) if not ch.isspace()), None)
                      if exc == 1 and p == "&":
                          continue
                      if exc == 2 and p == "'":
                          continue
                      found.append(kw + " at line " + str(masked[:s].count("\n") + 1))
              return found

          def rust_mask(tokens):
              parts = []
              for kind, text in tokens:
                  if kind == "literal":
                      parts.append("".join(" " if ch != "\n" else ch for ch in text))
                  elif kind == "comment":
                      parts.append("\n" * text.count("\n"))
                  else:
                      parts.append(text)
              return "".join(parts)

          def rust_code(tokens):
              return "".join(t for k, t in tokens if k in ("code", "lifetime"))

          def balanced(masked):
              stack = []
              pairs = {")": "(", "]": "[", "}": "{"}
              line = 1
              for c in masked:
                  if c == "\n":
                      line += 1
                  elif c in "([{":
                      stack.append((c, line))
                  elif c in ")]}":
                      if not stack or stack[-1][0] != pairs[c]:
                          return False
                      stack.pop()
              return not stack

          def rust_attribute_violations(code):
              permitted = {
                  "Clone",
                  "Copy",
                  "Debug",
                  "Default",
                  "Eq",
                  "PartialEq",
                  "bevy::ecs::component::Component",
                  "bevy::ecs::resource::Resource",
              }
              found = []
              for m in re.finditer(r"#!?\[([^\[\]]*)\]", code):
                  whole = m.group(0)
                  inner = m.group(1).strip()
                  if whole.startswith("#!") or not inner.startswith("derive(") or not inner.endswith(")"):
                      found.append("attribute form at line " + str(code[:m.start()].count("\n") + 1))
                      continue
                  for name in inner[len("derive("):-1].split(","):
                      if name.strip() not in permitted:
                          found.append("derive target " + name.strip() + " at line " + str(code[:m.start()].count("\n") + 1))
              return found

          def check_rust_source(path, src, expect_single_main):
              tokens = rust_tokens(src)
              comments = [t for k, t in tokens if k == "comment"]
              assert not comments, (path, "comments are prohibited", comments[:2])
              code = rust_code(tokens)
              attribute_violations = rust_attribute_violations(code)
              assert not attribute_violations, (path, attribute_violations)
              masked = rust_mask(tokens)
              violations = rust_keyword_violations(masked)
              assert not violations, (path, violations)
              assert balanced(masked), (path, "unbalanced brackets")
              fns = re.findall(r"\bfn\b", code)
              assert not re.search(r"\bimpl\b", code), (path, "impl block")
              if expect_single_main:
                  assert len(fns) == 1, (path, "expected exactly one fn, found " + str(len(fns)))
                  assert src.startswith("fn main() {"), (path, "file must begin with fn main")
              return len(fns), code.count("&mut")

          neg = [
              "fn main() { letter_head(); mutable_style(); constant_time(); static_assert_style(); }",
              "fn main() { resource_mut(0); }",
              "fn main() { g(\"use std::io; let x = 1; unsafe { } static A\"); }",
              "fn main(x: &'static str) {}",
              "fn main() { bevy::asset::AssetId::<bevy::text::Font>::DEFAULT_UUID; }",
              "fn main() { h(\"http://example.com//path\"); }",
          ]
          pos = [
              ("use std::io;", "use"),
              ("fn main() { use std::io; }", "use"),
              ("pub use std::io;", "use"),
              ("extern crate std;", "extern"),
              ("fn main() { let x = 1; }", "let"),
              ("fn main() { let mut x = 1; }", "mut"),
              ("fn main(mut x: u8) {}", "mut"),
              ("fn main() { let Some(x) = g() else { return }; }", "let"),
              ("fn main() { if let Some(x) = g() { } }", "let"),
              ("const A: u8 = 0;", "const"),
              ("static A: u8 = 0;", "static"),
              ("static mut A: u8 = 0;", "static"),
              ("fn main() { unsafe { } }", "unsafe"),
              ("fn main(p: *const u8) {}", "const"),
              ("fn main(p: *mut u8) {}", "mut"),
              ("fn main() { std::cell::RefCell::new(0); }", "RefCell"),
              ("fn main() { std::cell::Cell::new(0); }", "Cell"),
              ("fn main() { std::sync::Mutex::new(0); }", "Mutex"),
              ("fn main() { std::sync::RwLock::new(0); }", "RwLock"),
              ("fn main() { std::sync::atomic::AtomicBool::new(false); }", "AtomicBool"),
              ("fn main() { std::sync::atomic::AtomicUsize::new(0); }", "AtomicUsize"),
              ("macro_rules! m { () => {} }", "macro_rules"),
              ("fn main() { include_bytes!(\"x.png\"); }", "include_bytes"),
              ("fn main() { include_str!(\"x.txt\"); }", "include_str"),
              ("fn main() { std::mem::transmute(x); }", "transmute"),
              ("fn main() { std::slice::from_raw_parts(p, 1); }", "from_raw_parts"),
              ("fn main() { x.as_mut_ptr(); }", "as_mut_ptr"),
              ("fn main() -> std::boxed::Box<dyn Fn()> { g() }", "dyn"),
              ("#![no_implicit_prelude]", "no_implicit_prelude"),
          ]
          for fixture in neg:
              toks = rust_tokens(fixture)
              assert not [t for k, t in toks if k == "comment"], fixture
              assert not rust_keyword_violations(rust_mask(toks)), fixture
          for fixture, kw in pos:
              toks = rust_tokens(fixture)
              v = rust_keyword_violations(rust_mask(toks))
              assert any(x.startswith(kw + " ") for x in v), (fixture, kw, v)
          assert len(re.findall(r"\bfn\b", rust_code(rust_tokens("fn main() {} fn helper() {}")))) == 2
          assert len(re.findall(r"\bfn\b", rust_code(rust_tokens("fn main() { g(|x: u8| x); }")))) == 1
          for fixture, expect in [
              ("fn main() {} // trailing", 1),
              ("fn main() { g(\"http://x//y\"); }", 0),
              ("fn main() {}", 0),
          ]:
              got = len([t for k, t in rust_tokens(fixture) if k == "comment"])
              assert got == expect, (fixture, got, expect)
          for fixture, expect in [
              ("#[doc = \"x\"] fn main() {}", True),
              ("#![feature(x)] fn main() {}", True),
              ("#![no_implicit_prelude] fn main() {}", True),
              ("#[allow(warnings)] fn main() {}", True),
              ("#[derive(serde::Serialize)] fn main() {}", True),
              ("#[derive(Clone)] fn main() {}", False),
              ("#[derive(bevy::ecs::component::Component, Debug, Clone, Copy, PartialEq)] fn main() {}", False),
              ("#[derive(bevy::ecs::resource::Resource, Clone)] fn main() {}", False),
              ("fn main() {}", False),
          ]:
              code = rust_code(rust_tokens(fixture))
              got = bool(rust_attribute_violations(code))
              assert got == expect, (fixture, got, rust_attribute_violations(code))
          assert rust_attribute_violations(rust_code(rust_tokens("fn main() { let x = \"#[derive(Evil)]\"; }"))) == []
          print("rust checker fixtures: PASS")

          def toml_comments(text):
              count = 0
              i = 0
              n = len(text)
              while i < n:
                  c = text[i]
                  if c == '"':
                      i += 1
                      while i < n and text[i] != '"':
                          i += 2 if text[i] == "\\" else 1
                      i += 1
                  elif c == "'":
                      i += 1
                      while i < n and text[i] != "'":
                          i += 1
                      i += 1
                  elif c == "#":
                      count += 1
                      j = text.find("\n", i)
                      i = n if j < 0 else j
                  else:
                      i += 1
              return count

          assert toml_comments('a = 1 # c') == 1
          assert toml_comments('a = "# not"') == 0
          assert toml_comments("a = '# lit'") == 0
          assert toml_comments('a = "x" # real') == 1
          print("toml comment fixtures: PASS")

          def yaml_comments(text):
              count = 0
              block_indent = None
              for line in text.split("\n"):
                  stripped = line.lstrip(" ")
                  indent = len(line) - len(stripped)
                  if block_indent is not None:
                      if stripped == "" or indent > block_indent:
                          continue
                      block_indent = None
                  if re.search(r":\s*[|>][-+]?\s*$", line):
                      block_indent = indent
                      continue
                  scan = stripped
                  out = []
                  i = 0
                  while i < len(scan):
                      c = scan[i]
                      if c in "\"'":
                          quote = c
                          i += 1
                          while i < len(scan) and scan[i] != quote:
                              i += 2 if (quote == '"' and scan[i] == "\\") else 1
                          i += 1
                      else:
                          out.append(c)
                          i += 1
                  bare = "".join(out)
                  for m in re.finditer(r"(^|\s)#", bare):
                      count += 1
              return count

          assert yaml_comments("key: value # c") == 1
          assert yaml_comments('key: "a # b"') == 0
          assert yaml_comments("run: |\n  echo '# not a comment'\n") == 0
          assert yaml_comments("# leading\nkey: value\n") == 1
          assert yaml_comments("uses: actions/checkout@abc # v1") == 1
          print("yaml comment fixtures: PASS")

          rust_files = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "target")]
              for f in files:
                  if f.endswith(".rs"):
                      rust_files.append(os.path.join(root, f))
          assert sorted(rust_files) == [os.path.join(".", "src", "main.rs")], rust_files

          fn_total = 0
          mut_total = 0
          for path in rust_files:
              fns, muts = check_rust_source(path, pathlib.Path(path).read_text(), True)
              fn_total += fns
              mut_total += muts
          assert fn_total == 1, fn_total
          src_text = pathlib.Path(os.path.join("src", "main.rs")).read_text()
          code = rust_code(rust_tokens(src_text))
          assert mut_total == 8, mut_total
          assert code.count("&mut bevy::ecs::world::World") == 3
          assert code.count("&mut bevy::camera::visibility::Visibility") == 1
          assert code.count("&mut bevy::transform::components::Transform") == 1
          assert code.count("&mut bevy::sprite::Sprite") == 1
          assert code.count("&mut bevy::text::TextColor") == 1
          assert code.count("&mut bevy::text::TextBounds") == 1
          assert re.findall(r"\benum (\w+)", code) == ["Destination", "Control", "Role"], re.findall(r"\benum (\w+)", code)
          assert re.findall(r"\bstruct (\w+)", code) == ["Layout", "UiState", "UiImages"], re.findall(r"\bstruct (\w+)", code)
          print("rust source policy: PASS (1 fn, 0 comments, 0 keyword violations, 6 verified derives, 8 audited &mut)")

          manifests = []
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "target")]
              for f in files:
                  if f == "Cargo.toml":
                      manifests.append(os.path.join(root, f))
          assert manifests == [os.path.join(".", "Cargo.toml")], manifests
          assert not os.path.exists(".cargo"), ".cargo directory must not exist"
          assert not os.path.exists("build.rs")
          for d in ("examples", "benches", "tests"):
              assert not os.path.exists(d), d

          for path in ["Cargo.toml", "rust-toolchain.toml"]:
              text = pathlib.Path(path).read_text()
              assert toml_comments(text) == 0, (path, "comments are prohibited")

          manifest_text = pathlib.Path("Cargo.toml").read_text()
          assert "cargo-features" not in manifest_text
          assert "0.0.0.0.0.0" not in manifest_text
          manifest = tomllib.loads(manifest_text)
          package = manifest["package"]
          assert package["name"] == "subsystem-for-arxumbra"
          version = package["version"]
          core, _, pre = version.partition("-")
          segments = core.split(".")
          assert len(segments) == 3 and all(s.isdigit() for s in segments), version
          assert pre == "" or all(
              s and all(ch.isalnum() or ch == "-" for ch in s) for s in pre.split(".")
          ), version
          assert len(segments) != 6
          bevy = manifest["dependencies"]["bevy"]
          assert bevy["git"] == "https://github.com/bevyengine/bevy", bevy
          assert bevy["tag"] == "v0.20.0", bevy
          assert "rev" not in bevy
          assert bevy["default-features"] is False
          assert "x11" in bevy["features"], bevy["features"]
          assert "wayland" in bevy["features"], bevy["features"]
          assert "bevy_log" in bevy["features"], bevy["features"]

          def dep_sections(table):
              for key in ("dependencies", "build-dependencies", "dev-dependencies"):
                  for name, dep in table.get(key, {}).items():
                      yield name, dep
              for target in table.get("target", {}).values():
                  for key in ("dependencies", "build-dependencies", "dev-dependencies"):
                      for name, dep in target.get(key, {}).items():
                          yield name, dep

          for name, dep in dep_sections(manifest):
              identity = dep.get("package", name) if isinstance(dep, dict) else name
              assert identity not in ("wgpu", "wgpu-types", "wgpu-hal", "wgpu-core"), (name, dep)
          release_profile = manifest["profile"]["release"]
          assert release_profile["panic"] == "abort"
          assert release_profile["lto"] == "fat"
          assert release_profile["codegen-units"] == 1
          lints = manifest.get("lints", {})
          assert set(lints.keys()) <= {"clippy", "rust"}, lints
          for lint_table_name, lint_table in lints.items():
              assert isinstance(lint_table, dict), (lint_table_name, lint_table)
              for lint_name, lint_level in lint_table.items():
                  assert re.fullmatch(r"[a-z][a-z0-9_]*", lint_name), (lint_table_name, lint_name)
                  assert lint_name not in ("all", "warnings"), (lint_table_name, lint_name)
                  assert lint_level in ("allow", "warn", "deny", "forbid"), (lint_name, lint_level)
          toolchain = tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())
          channel = toolchain["toolchain"]["channel"]
          assert re.fullmatch(r"\d+\.\d+\.\d+", channel), channel
          print("manifest policy: PASS (git tag v0.20.0, no wgpu identity, stable " + channel + ", semver " + version + ")")

          workflow_files = sorted(str(p) for p in pathlib.Path(".github/workflows").glob("*.yml"))
          assert workflow_files == [
              ".github/workflows/ci.yml",
              ".github/workflows/lockfile.yml",
              ".github/workflows/release.yml",
          ], workflow_files
          for path in workflow_files:
              text = pathlib.Path(path).read_text()
              assert yaml_comments(text) == 0, (path, "comments are prohibited")

          import yaml

          release = yaml.safe_load(pathlib.Path(".github/workflows/release.yml").read_text())
          ci = yaml.safe_load(pathlib.Path(".github/workflows/ci.yml").read_text())
          lockfile = yaml.safe_load(pathlib.Path(".github/workflows/lockfile.yml").read_text())

          def collect_uses(node, out):
              if isinstance(node, dict):
                  for key, value in node.items():
                      if key == "uses" and isinstance(value, str):
                          out.append(value)
                      else:
                          collect_uses(value, out)
              elif isinstance(node, list):
                  for item in node:
                      collect_uses(item, out)

          uses_refs = []
          collect_uses(release, uses_refs)
          collect_uses(ci, uses_refs)
          collect_uses(lockfile, uses_refs)
          assert len(uses_refs) >= 8, uses_refs
          for ref in uses_refs:
              if ref.startswith("./"):
                  assert ref == "./.github/workflows/ci.yml", ref
                  continue
              action, _, sha = ref.partition("@")
              assert action in (
                  "actions/checkout",
                  "actions/cache",
                  "actions/upload-artifact",
                  "actions/download-artifact",
              ), ref
              assert re.fullmatch(r"[0-9a-f]{40}", sha), ref
          print("workflow comment and pin policy: PASS (" + str(len(uses_refs)) + " uses refs)")
          assert release["permissions"] == {"contents": "read"}
          assert ci["permissions"] == {"contents": "read"}
          assert lockfile["permissions"] == {"contents": "read"}
          assert release["jobs"]["release"]["permissions"] == {"contents": "write"}
          assert lockfile["jobs"]["lockfile"]["permissions"] == {"contents": "write"}
          lockfile_on = lockfile.get("on", lockfile.get(True))
          assert lockfile_on == {"push": {"branches": ["arena/699178e0-subsystem-for-arxumbra"]}}, lockfile_on
          for job_name, job in release["jobs"].items():
              if job_name != "release":
                  assert job.get("permissions", {"contents": "read"}) == {"contents": "read"}, job_name
          for job_name, job in ci["jobs"].items():
              assert job.get("permissions", {"contents": "read"}) == {"contents": "read"}, job_name
          matrix = release["jobs"]["build"]["strategy"]["matrix"]["include"]
          expected = [
              {"artifact": "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "ubuntu-24.04-arm", "target": "aarch64-unknown-linux-gnu", "extension": ""},
              {"artifact": "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "ubuntu-24.04", "target": "x86_64-unknown-linux-gnu", "extension": ""},
              {"artifact": "AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "macos-15", "target": "aarch64-apple-darwin", "extension": ""},
              {"artifact": "x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "macos-15-intel", "target": "x86_64-apple-darwin", "extension": ""},
              {"artifact": "AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "windows-11-arm", "target": "aarch64-pc-windows-msvc", "extension": ".exe"},
              {"artifact": "x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1", "runner": "windows-2025", "target": "x86_64-pc-windows-msvc", "extension": ".exe"},
          ]
          assert matrix == expected, matrix
          names = [e["artifact"] + e["extension"] for e in matrix]
          assert names == [
              "AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1",
              "x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1",
              "AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1",
              "x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1",
              "AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.exe",
              "x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1.exe",
          ], names
          release_text = pathlib.Path(".github/workflows/release.yml").read_text()
          assert ".exe.exe" not in release_text
          assert "name: ${{ matrix.artifact }}" in release_text
          assert "runs-on: ${{ matrix.runner }}" in release_text
          assert "${{ matrix.artifact }}${{ matrix.extension }}" in release_text
          assert "${{ matrix.artifact }}.tar.gz" in release_text
          assert release["jobs"]["build"]["strategy"]["fail-fast"] is False
          assert release["jobs"]["release"]["if"] == "startsWith(github.ref, 'refs/tags/v')"
          print("release matrix and naming policy: PASS (6 entries, exact names)")

          assets = sorted(
              os.path.join(root, f)
              for root, dirs, files in os.walk("assets")
              for f in files
          )
          assert assets == sorted([
              "assets/app-icon.png",
              "assets/icons/flask.png",
              "assets/icons/house.png",
              "assets/icons/registry.png",
              "assets/icons/rocket-pill.png",
              "assets/icons/rocket.png",
          ]), assets
          for path in assets:
              with open(path, "rb") as handle:
                  assert handle.read(8) == bytes.fromhex("89504e470d0a1a0a"), path
          print("asset policy: PASS (6 PNGs, exact tree)")
          print("POLICY SCAN: ALL CHECKS PASSED")
          PY

  toolchain:
    name: Format, lint, compile, and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Linux system libraries (winit wayland and x11 backends)
        run: |
          set -euo pipefail
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Activate the pinned toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain

      - name: Cache Cargo registry, Git checkouts, and target directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-ci-${{ runner.os }}-

      - name: Format diff report (diagnostic; the strict check follows)
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.diff 2>&1
          status=$?
          {
            echo "## cargo fmt --check diagnostic (exit $status)"
            echo '```diff'
            head -c 50000 /tmp/fmt.diff
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Require the committed Cargo-resolved lockfile
        run: |
          set -euo pipefail
          test -f Cargo.lock
          grep -q "name = \"bevy\"" Cargo.lock

      - name: Dependency metadata and duplicate report
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          cargo tree --locked --duplicates

      - name: Lint
        run: |
          set +e
          cargo clippy --locked --all-targets -- -D warnings > /tmp/clippy.log 2>&1
          status=$?
          {
            echo "## cargo clippy diagnostic (exit $status)"
            echo '```text'
            tail -c 50000 /tmp/clippy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Compile check of all targets
        run: cargo check --locked --all-targets

      - name: Test harness (empty by policy; the count is reported honestly)
        run: cargo test --locked

      - name: Release build
        run: cargo build --locked --release

      - name: Headless X11 smoke check (Xvfb + lavapipe + scripted interaction; software rendering reported separately)
        run: |
          set -uo pipefail
          sudo apt-get update || sudo apt-get update
          sudo apt-get install -y xvfb xauth xdotool imagemagick x11-utils mesa-vulkan-drivers libvulkan1 vulkan-tools libxkbcommon-x11-0
          ICD=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          if [ -f "$ICD" ]; then
            export VK_ICD_FILENAMES="$ICD"
          fi
          vulkaninfo --summary > /tmp/vkinfo.log 2>&1 || true
          cat /tmp/vkinfo.log
          Xvfb :99 -screen 0 1366x768x24 > /tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          export DISPLAY=:99
          sleep 2
          xdpyinfo | head -3
          LOG=/tmp/smoke.log
          SHOTS=/tmp/shots
          mkdir -p "$SHOTS"
          FAIL=0
          ./target/release/subsystem-for-arxumbra > "$LOG" 2>&1 &
          APP_PID=$!
          READY=0
          for _ in $(seq 1 90); do
            sleep 1
            if grep -q "ARXUMBRA-INTERACTIVE" "$LOG"; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              break
            fi
          done
          if [ "$READY" != 1 ]; then
            echo "smoke FAIL: ARXUMBRA-INTERACTIVE readiness line not found within 90 s" >&2
            FAIL=1
          fi
          if ! grep -q "ARXUMBRA-STARTUP" "$LOG"; then
            echo "smoke FAIL: ARXUMBRA-STARTUP line missing" >&2
            FAIL=1
          fi
          if grep -q "panicked" "$LOG"; then
            echo "smoke FAIL: process panicked" >&2
            FAIL=1
          fi
          grep -i "AdapterInfo" "$LOG" || echo "note: no AdapterInfo line found; renderer identity unconfirmed by this log"
          LINE=$(grep "ARXUMBRA-INTERACTIVE" "$LOG" | head -1)
          HOME_RECT=$(echo "$LINE" | sed -n 's/.*home=\([-0-9.,]*\) registry=.*/\1/p')
          REG_RECT=$(echo "$LINE" | sed -n 's/.*registry=\([-0-9.,]*\) launch=.*/\1/p')
          LAUNCH_RECT=$(echo "$LINE" | sed -n 's/.*launch=\([-0-9.,]*\).*/\1/p')
          echo "control rects from the application log: home=$HOME_RECT registry=$REG_RECT launch=$LAUNCH_RECT"
          CENTER_HX=$(echo "$HOME_RECT" | awk -F, '{printf "%d", $1 + $3 / 2}')
          CENTER_HY=$(echo "$HOME_RECT" | awk -F, '{printf "%d", $2 + $4 / 2}')
          CENTER_RX=$(echo "$REG_RECT" | awk -F, '{printf "%d", $1 + $3 / 2}')
          CENTER_RY=$(echo "$REG_RECT" | awk -F, '{printf "%d", $2 + $4 / 2}')
          xdotool search --name "Arxumbra" windowfocus || echo "note: windowfocus reported failure"
          sleep 1
          import -window root "$SHOTS/home0.png"
          xdotool key F1
          sleep 1.5
          import -window root "$SHOTS/home1.png"
          xdotool key Tab
          sleep 1
          import -window root "$SHOTS/focus1.png"
          xdotool key Tab
          sleep 1
          import -window root "$SHOTS/focus2.png"
          xdotool key Return
          sleep 1.5
          import -window root "$SHOTS/registry1.png"
          xdotool mousemove "$CENTER_HX" "$CENTER_HY"
          sleep 1
          import -window root "$SHOTS/hover1.png"
          xdotool mousedown 1
          sleep 0.5
          xdotool mouseup 1
          sleep 1.5
          import -window root "$SHOTS/home2.png"
          xdotool mousemove 1360 760
          sleep 1
          import -window root "$SHOTS/home2n.png"
          xdotool mousemove "$CENTER_RX" "$CENTER_RY"
          sleep 0.7
          xdotool mousedown 1
          sleep 0.7
          xdotool mousemove 5 5
          sleep 0.7
          xdotool mouseup 1
          sleep 1.5
          import -window root "$SHOTS/cancel1.png"
          for PAIR in "home0 home1 4000 gt F1 reveals the HUD" "home1 focus1 100 gt Tab shows the focus ring" "focus1 focus2 100 gt the focus ring moves" "home1 registry1 4000 gt Enter opens the Registry panel" "registry1 hover1 2000 gt hovering the Home tab restyles it" "hover1 home2 4000 gt clicking Home removes the Registry panel" "cancel1 registry1 4000 gt the cancelled press did not select Registry"; do
            set -- $PAIR
            compare -metric AE -fuzz 2% "$SHOTS/$1.png" "$SHOTS/$2.png" null: 2>"/tmp/ae_$1_$2.txt" || true
            AE=$(tr -dc "0-9" < "/tmp/ae_$1_$2.txt")
            echo "AE($1,$2)=$AE (expect $3 $4: $5)"
            if [ -z "$AE" ]; then
              echo "smoke FAIL: comparison $1 vs $2 produced no metric" >&2
              FAIL=1
            elif [ "$3" = gt ] && [ "$AE" -le "$4" ]; then
              echo "smoke FAIL: $1 vs $2 changed by only $AE pixels" >&2
              FAIL=1
            fi
          done
          compare -metric AE -fuzz 2% "$SHOTS/home2n.png" "$SHOTS/cancel1.png" null: 2>/tmp/ae_same.txt || true
          AE_SAME=$(tr -dc "0-9" < /tmp/ae_same.txt)
          echo "AE(home2n,cancel1)=$AE_SAME (expect lt 3000: release outside changed nothing but the cursor)"
          if [ -n "$AE_SAME" ] && [ "$AE_SAME" -ge 3000 ]; then
            echo "smoke FAIL: release outside altered the scene by $AE_SAME pixels" >&2
            FAIL=1
          fi
          xdotool keydown Escape || true
          EXITED=0
          for _ in $(seq 1 20); do
            sleep 1
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              EXITED=1
              break
            fi
          done
          xdotool keyup Escape 2>/dev/null || true
          wait "$APP_PID"
          APP_RC=$?
          echo "app exit code after Escape hold: $APP_RC (expect 0)"
          if [ "$EXITED" != 1 ]; then
            echo "smoke FAIL: Escape hold did not exit the app within 20 s" >&2
            FAIL=1
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          elif [ "$APP_RC" != 0 ]; then
            echo "smoke FAIL: unexpected exit code $APP_RC" >&2
            FAIL=1
          fi
          kill "$XVFB_PID" 2>/dev/null || true
          {
            echo "## smoke check application log (tail)"
            echo '```text'
            tail -c 40000 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FAIL" != 0 ]; then
            exit 1
          fi
          echo "smoke check PASSED: startup + interactive readiness, scripted keyboard and pointer scenarios, cancelled press, Escape-hold exit 0 (software renderer lavapipe; reported separately from physical GPU results)"

      - name: Upload smoke evidence (screenshots and application log)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: smoke-evidence-linux-x11-lavapipe
          path: |
            /tmp/shots
            /tmp/smoke.log
          if-no-files-found: warn
