name: Release
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  RUST_TOOLCHAIN: nightly-2026-10-19
jobs:
  release:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - artifact: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          extension: ""
        - artifact: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          extension: ""
        - artifact: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: macos-15
          target: aarch64-apple-darwin
          extension: ""
        - artifact: x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: macos-15-intel
          target: x86_64-apple-darwin
          extension: ""
        - artifact: AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: windows-11-arm
          target: aarch64-pc-windows-msvc
          extension: .exe
        - artifact: x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s0
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          extension: .exe
    env:
      ARTIFACT: ${{ matrix.artifact }}
      TARGET: ${{ matrix.target }}
      EXT: ${{ matrix.extension }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Wayland build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
    - name: Install Rust nightly
      run: rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --target "${TARGET}" --no-self-update
    - name: Build release binary
      run: cargo +"${RUST_TOOLCHAIN}" build --locked --release --quiet --target "${TARGET}" --bin subsystem-for-arxumbra
    - name: Stage executable
      run: |
        mkdir -p "dist/${ARTIFACT}"
        cp "target/${TARGET}/release/subsystem-for-arxumbra${EXT}" "dist/${ARTIFACT}/${ARTIFACT}${EXT}"
    - name: Package archive
      if: runner.os != 'Windows'
      run: tar -czf "dist/${ARTIFACT}.tar.gz" -C dist "${ARTIFACT}"
    - name: Package archive
      if: runner.os == 'Windows'
      run: pwsh -NoProfile -Command "Compress-Archive -Path 'dist/${ARTIFACT}/${ARTIFACT}${EXT}' -DestinationPath 'dist/${ARTIFACT}.zip' -CompressionLevel Optimal"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.artifact }}${{ matrix.extension == '.exe' && '.zip' || '.tar.gz' }}
        if-no-files-found: error
        retention-days: 14
