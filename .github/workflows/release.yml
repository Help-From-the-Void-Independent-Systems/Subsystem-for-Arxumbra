name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: subsystem-for-arxumbra-linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - artifact: subsystem-for-arxumbra-linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - artifact: subsystem-for-arxumbra-macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - artifact: subsystem-for-arxumbra-macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - artifact: subsystem-for-arxumbra-windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
          - artifact: subsystem-for-arxumbra-windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Verify background texture
        run: |
          set -euo pipefail
          file=assets/000.ktx2
          test -s "$file"
          magic="$(od -An -tx1 -N12 "$file" | tr -d ' \n' | tr 'A-F' 'a-f')"
          if [ "$magic" != "ab4b5458203230bb0d0a1a0a" ]; then
            echo "Invalid KTX2 payload: $file" >&2
            exit 1
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename executable
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/subsystem-for-arxumbra${{ matrix.extension }}" "dist/${{ matrix.artifact }}${{ matrix.extension }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ matrix.extension }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          shopt -s nullglob
          gh release upload "$TAG" dist/* --clobber
