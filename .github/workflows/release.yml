name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: subsystem-for-arxumbra-linux-x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - artifact: subsystem-for-arxumbra-linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - artifact: subsystem-for-arxumbra-macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - artifact: subsystem-for-arxumbra-macos-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - artifact: subsystem-for-arxumbra-windows-x86_64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
          - artifact: subsystem-for-arxumbra-windows-aarch64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: "Verify the assets/ resource folder (Task 11 icons)"
        run: |
          set -euo pipefail
          test -d assets
          for f in assets/app-icon.png assets/icons/*.png; do
            test -f "$f"
            head -c 8 "$f" | od -An -tx1 | tr -d ' \n' | grep -q '89504e470d0a1a0a'
          done
          ! grep -q 'include_bytes!' src/main.rs
          grep -q 'AssetPlugin' src/main.rs
          grep -q 'AssetServer' src/main.rs
          grep -q '"png",' Cargo.toml

      - name: "Install Linux build chain (LLVM: clang + lld)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev clang lld llvm

      - name: Install Rust toolchain (pre-release/nightly, with sources for build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
          components: rust-src

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename executable
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/subsystem-for-arxumbra${{ matrix.extension }}" "dist/${{ matrix.artifact }}${{ matrix.extension }}"

      - name: "Stage the assets/ resource folder"
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact }}-assets"
          cp -r assets/. "dist/${{ matrix.artifact }}-assets/"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}${{ matrix.extension }}
            dist/${{ matrix.artifact }}-assets/
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          shopt -s nullglob
          gh release upload "$TAG" dist/* --clobber
