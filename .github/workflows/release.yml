name: Release
on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
        - artifact: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: ubuntu-24.04-arm
          target: aarch64-unknown-linux-gnu
          extension: ""
        - artifact: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: ubuntu-24.04
          target: x86_64-unknown-linux-gnu
          extension: ""
        - artifact: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: macos-15
          target: aarch64-apple-darwin
          extension: ""
        - artifact: x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: macos-15-intel
          target: x86_64-apple-darwin
          extension: ""
        - artifact: AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: windows-11-arm
          target: aarch64-pc-windows-msvc
          extension: .exe
        - artifact: x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
          runner: windows-2025
          target: x86_64-pc-windows-msvc
          extension: .exe
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install Wayland build dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
    - name: Install Rust nightly
      run: rustup toolchain install nightly-2026-10-19 --profile minimal --target "${{ matrix.target }}" --no-self-update
    - name: Build release binary
      run: cargo +nightly-2026-10-19 --config 'build.jobs=1' --config 'profile.release.opt-level=3' --config 'profile.release.lto="thin"' --config 'profile.release.codegen-units=1' --config 'profile.release.debug=0' --config 'profile.release.strip="symbols"' --config 'profile.release.panic="abort"' --config 'profile.release.debug-assertions=false' --config 'profile.release.overflow-checks=false' --config 'profile.release.incremental=false' build --locked --release --quiet --target "${{ matrix.target }}" --bin Subsystem-for-Arxumbra
    - name: Stage executable
      run: |
        mkdir -p "dist/${{ matrix.artifact }}"
        cp "target/${{ matrix.target }}/release/Subsystem-for-Arxumbra${{ matrix.extension }}" "dist/${{ matrix.artifact }}/${{ matrix.artifact }}${{ matrix.extension }}"
    - name: Package archive
      if: runner.os != 'Windows'
      run: tar -czf "dist/${{ matrix.artifact }}.tar.gz" -C dist "${{ matrix.artifact }}"
    - name: Package archive
      if: runner.os == 'Windows'
      run: pwsh -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.artifact }}/${{ matrix.artifact }}${{ matrix.extension }}' -DestinationPath 'dist/${{ matrix.artifact }}.zip' -CompressionLevel Optimal"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: ${{ matrix.artifact }}
        path: dist/${{ matrix.artifact }}${{ matrix.extension == '.exe' && '.zip' || '.tar.gz' }}
        if-no-files-found: error
        retention-days: 14
