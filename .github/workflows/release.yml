name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      regenerate_lockfile:
        description: Regenerate Cargo.lock through cargo, upload it as an artifact, and validate this run against it
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EVIDENCE_DIR: evidence/validation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev

      - name: Activate pinned toolchain
        run: |
          set -euo pipefail
          rustup show active-toolchain
          rustup component add rustfmt clippy
          rustc --version

      - name: Regenerate lockfile on explicit request or when stale
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          regenerate=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.regenerate_lockfile }}" = "true" ]; then
            regenerate=true
          elif ! grep -q 'bevyengine/bevy?tag=v0.20.0#' Cargo.lock; then
            echo "committed lockfile does not resolve bevy from tag v0.20.0; bootstrapping"
            regenerate=true
          fi
          if [ "$regenerate" = "true" ]; then
            cargo generate-lockfile
            sed -i.bak '/^# This file is automatically @generated by Cargo\.$/d;/^# It is not intended for manual editing\.$/d' Cargo.lock
            rm -f Cargo.lock.bak
          fi
          echo "regenerated=$regenerate" >> "$GITHUB_OUTPUT"

      - name: Upload lockfile candidate
        if: steps.lockfile.outputs.regenerated == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lockfile-candidate
          path: Cargo.lock
          if-no-files-found: error

      - name: Syntax and comment policy
        shell: bash
        run: |
          set -uo pipefail
          python3 scripts/verify_syntax.py 2>&1 | tee evidence/verify_syntax.log
          status=$?
          if [ "$status" -ne 0 ]; then
            sed 's/^/::error::/' evidence/verify_syntax.log
            exit "$status"
          fi

      - name: Source policy
        id: policy
        shell: bash
        run: |
          set -uo pipefail
          python3 -m pip install --quiet pyyaml
          python3 scripts/verify_policy.py --mode source 2>&1 | tee "$EVIDENCE_DIR/policy.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            message=$(head -n 1 "$EVIDENCE_DIR/policy.log" | cut -c 1-120 | tr '\n' ' ')
            echo "message=$message" >> "$GITHUB_OUTPUT"
            sed 's/^/::error::/' "$EVIDENCE_DIR/policy.log"
            exit "$status"
          fi

      - name: Policy outcome ${{ steps.policy.outputs.message }}
        if: always()
        shell: bash
        run: echo recorded

      - name: Dependency graph evidence and X11 absence
        shell: bash
        run: |
          set -uo pipefail
          cargo tree --locked --duplicates > "$EVIDENCE_DIR/duplicates.txt" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            sed 's/^/::error::/' "$EVIDENCE_DIR/duplicates.txt"
            exit "$status"
          fi
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            for package in x11 x11rb x11-dl arboard; do
              cargo tree --locked --target "$target" --invert "$package" > "$EVIDENCE_DIR/invert-$target-$package.txt" 2>&1 || true
              if grep -Eq 'nothing to print|did not match any packages' "$EVIDENCE_DIR/invert-$target-$package.txt"; then
                echo "$target: $package absent" | tee -a "$EVIDENCE_DIR/x11-absence.log"
              else
                echo "::error::unexpected $package inside the $target dependency graph"
                head -n 24 "$EVIDENCE_DIR/invert-$target-$package.txt" | sed 's/^/::error::/'
                exit 1
              fi
            done
            if ! cargo tree --locked --target "$target" --edges features --package winit > "$EVIDENCE_DIR/winit-features-$target.txt" 2>&1; then
              echo "::error::cargo tree failed for winit features on $target"
              cat "$EVIDENCE_DIR/winit-features-$target.txt" | sed 's/^/::error::/'
              exit 1
            fi
            if grep -q 'feature "x11"' "$EVIDENCE_DIR/winit-features-$target.txt"; then
              echo "::error::winit x11 feature activated for $target"
              exit 1
            fi
            echo "$target: winit x11 feature inactive" | tee -a "$EVIDENCE_DIR/x11-absence.log"
          done

      - name: Formatting
        shell: bash
        run: |
          set -uo pipefail
          cargo fmt --all -- --check 2>&1 | tee "$EVIDENCE_DIR/fmt.log"
            status=$?
            if [ "$status" -ne 0 ]; then
            tail -n 60 "$EVIDENCE_DIR/fmt.log" | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Check
        id: check
        shell: bash
        run: |
          set -uo pipefail
          cargo check --locked --all-targets 2>&1 | tee "$EVIDENCE_DIR/check.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            message=$(grep -m 2 -E '^error' "$EVIDENCE_DIR/check.log" | cut -c 1-110 | tr '\n' ' ')
            echo "message=$message" >> "$GITHUB_OUTPUT"
            tail -n 120 "$EVIDENCE_DIR/check.log" | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Check reflector ${{ steps.check.outputs.message }}
        if: always()
        shell: bash
        run: echo recorded

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set -uo pipefail
          cargo clippy --locked --all-targets -- -D warnings 2>&1 | tee "$EVIDENCE_DIR/clippy.log"
          status=$?
          if [ "$status" -ne 0 ]; then
            message=$(grep -m 2 -E '^error' "$EVIDENCE_DIR/clippy.log" | cut -c 1-110 | tr '\n' ' ')
            echo "message=$message" >> "$GITHUB_OUTPUT"
            tail -n 120 "$EVIDENCE_DIR/clippy.log" | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Clippy reflector ${{ steps.clippy.outputs.message }}
        if: always()
        shell: bash
        run: echo recorded

      - name: Tests
        shell: bash
        run: |
          set -uo pipefail
          cargo test --locked 2>&1 | tee "$EVIDENCE_DIR/test.log"
            status=$?
            if [ "$status" -ne 0 ]; then
            tail -n 120 "$EVIDENCE_DIR/test.log" | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Metadata evidence
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > "$EVIDENCE_DIR/metadata.json"
          python3 -c "import json,sys; metadata=json.load(open(sys.argv[1])); root=[p for p in metadata['packages'] if p['name']=='subsystem-for-arxumbra']; assert root, 'root package missing'; assert any(t['kind']==['bin'] for t in root[0]['targets']), 'no bin target'; print('bin target present')" "$EVIDENCE_DIR/metadata.json"

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### Validation"
            for record in policy fmt check clippy test; do
              if [ -f "$EVIDENCE_DIR/$record.log" ]; then
                echo "- $record: produced"
              else
                echo "- $record: not produced"
              fi
            done
            echo "- syntax and fixture selftest: ran as its own step"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validation-evidence
          path: evidence/
          if-no-files-found: error

  build:
    name: ${{ matrix.artifact }}
    needs: validation
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_DIR: evidence/${{ matrix.target }}
      STAGED_EXECUTABLE: dist/${{ matrix.artifact }}/${{ matrix.artifact }}${{ matrix.extension }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: AArch64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            extension: ""
          - artifact: x86_64-Linux-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            extension: ""
          - artifact: AArch64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: macos-15
            target: aarch64-apple-darwin
            extension: ""
          - artifact: x86_64-macOS-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: macos-15-intel
            target: x86_64-apple-darwin
            extension: ""
          - artifact: AArch64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            extension: .exe
          - artifact: x86_64-Windows-Subsystem-for-Arxumbra-v0.0.0.0.0.0-s1
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            extension: .exe
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prepare evidence directory
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"

      - name: Install Linux build and smoke dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev weston wayland-utils mesa-vulkan-drivers
          if sudo apt-get install -y wtype; then
            echo "wtype installed" >> "$EVIDENCE_DIR/smoke-prereqs.log"
          else
            echo "wtype unavailable; keyboard phases will be NOT RUN" >> "$EVIDENCE_DIR/smoke-prereqs.log"
          fi

      - name: Install target toolchain
        run: |
          set -euo pipefail
          rustup target add ${{ matrix.target }}
          rustup show active-toolchain

      - name: Regenerate lockfile when stale
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q 'bevyengine/bevy?tag=v0.20.0#' Cargo.lock; then
            cargo generate-lockfile
            sed -i.bak '/^# This file is automatically @generated by Cargo\.$/d;/^# It is not intended for manual editing\.$/d' Cargo.lock
            rm -f Cargo.lock.bak
          fi

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.runner }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}

      - name: Build release for target
        shell: bash
        run: |
          set -uo pipefail
          cargo build --locked --release --target ${{ matrix.target }} --bin subsystem-for-arxumbra 2>&1 | tee "$EVIDENCE_DIR/build.log"
            status=$?
            if [ "$status" -ne 0 ]; then
            tail -n 120 "$EVIDENCE_DIR/build.log" | sed 's/^/::error::/'
            exit "$status"
          fi
          echo "::notice::release artifacts:"
          find "target/${{ matrix.target }}/release" -maxdepth 1 -type f 2>&1 | head -n 12 | sed 's/^/::notice::/'
          tail -n 8 "$EVIDENCE_DIR/build.log" | sed 's/^/::notice::/'

      - name: Stage distribution directory
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "dist/${{ matrix.artifact }}"
          cp "target/${{ matrix.target }}/release/subsystem-for-arxumbra${{ matrix.extension }}" "$STAGED_EXECUTABLE" 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::[stage] executable missing; release directory contents:"
            ls -la "target/${{ matrix.target }}/release" 2>&1 | head -n 30 | sed 's/^/::error::[stage] /'
            exit 1
          fi
          chmod 755 "$STAGED_EXECUTABLE" || true
          cp -r assets "dist/${{ matrix.artifact }}/assets"

      - name: Record staged executable type
        shell: bash
        run: |
          set -uo pipefail
          if command -v file > /dev/null 2>&1; then
            file "$STAGED_EXECUTABLE" | tee "$EVIDENCE_DIR/executable-type.log"
          else
            echo "file utility unavailable" | tee "$EVIDENCE_DIR/executable-type.log"
          fi

      - name: Wayland smoke on staged executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          bash scripts/smoke_wayland.sh "$STAGED_EXECUTABLE" assets "$EVIDENCE_DIR/smoke" 2>&1 | tee "$EVIDENCE_DIR/smoke-run.log"
            status=$?
            if [ "$status" -ne 0 ]; then
            tail -n 80 "$EVIDENCE_DIR/smoke-run.log" | sed 's/^/::error::/'
            exit "$status"
          fi

      - name: Package and checksum
        run: |
          set -euo pipefail
          PYTHON=python3
          command -v python3 > /dev/null 2>&1 || PYTHON=python
          "$PYTHON" scripts/make_package.py "dist/${{ matrix.artifact }}" "dist/${{ matrix.artifact }}.zip"

      - name: Summarize smoke
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.artifact }}"
            if [ -f "$EVIDENCE_DIR/smoke/smoke-status.tsv" ]; then
              cat "$EVIDENCE_DIR/smoke/smoke-status.tsv"
            else
              echo "smoke status file not produced"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-evidence-${{ matrix.target }}
          path: evidence/
          if-no-files-found: warn

      - name: Upload distribution package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.zip
            dist/${{ matrix.artifact }}.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download verified packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true

      - name: Build package manifest
        run: |
          set -euo pipefail
          PYTHON=python3
          command -v python3 > /dev/null 2>&1 || PYTHON=python
          "$PYTHON" - <<'PY'
          import json
          import pathlib
          manifest = {}
          for record in pathlib.Path("dist").glob("*.sha256"):
              digest, name = record.read_text().split()
              manifest[name[: -len(".zip")]] = digest
          pathlib.Path("dist/package-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Verify packages
        run: |
          set -euo pipefail
          python3 scripts/verify_policy.py --mode packages --dist-dir dist --package-manifest dist/package-manifest.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.zip dist/*.zip.sha256 --clobber
